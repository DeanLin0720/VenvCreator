name: Release

# 推送 v* 標籤（例如 v1.0.0）時打包並建立 GitHub Release；
# 手動執行只打包，產出放在該次執行的 Artifacts。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Check tag matches APP_VERSION
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          $ver = (Select-String -Path venv_creator.py -Pattern '^APP_VERSION = "(.+)"').Matches[0].Groups[1].Value
          if ("v$ver" -ne $env:GITHUB_REF_NAME) {
            throw "Tag $env:GITHUB_REF_NAME does not match APP_VERSION $ver"
          }

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install PySide6==6.12.0 pyinstaller==6.22.3

      - name: Build
        run: >
          pyinstaller --noconfirm -D --windowed --name VenvCreator
          --icon logo/venv_creator.ico --add-data "logo;logo" venv_creator.py

      - name: Package
        id: package
        run: |
          $zip = "VenvCreator-$env:GITHUB_REF_NAME-windows-x64.zip"
          Compress-Archive -Path dist/VenvCreator -DestinationPath $zip
          "zip=$zip" >> $env:GITHUB_OUTPUT

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: VenvCreator-windows-x64
          path: ${{ steps.package.outputs.zip }}

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create $env:GITHUB_REF_NAME ${{ steps.package.outputs.zip }}
          --title "VenvCreator $env:GITHUB_REF_NAME" --generate-notes
